name: LibreJourneyAudit
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  JourneyAudit:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Journeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.libredebug.JourneyAudit
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JourneyAudit:
    build:
      targets:
        JourneyAudit: [test]
    test:
      targets:
        - JourneyAudit
