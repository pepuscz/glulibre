# Modified for GluLibre on 2026-09-20; upstream history retains the original workflow.
name: Build GluLibre (manual)
run-name: Build GluLibre (${{ github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload to TestFlight after separately completing the release checklist"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit
  build:
    name: Signed archive
    needs: validate
    runs-on: macos-26
    steps:
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Check out the selected fork revision
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: bundle install
      - name: Retain upstream Match table suppression
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"
      - name: Build and archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Upload to TestFlight (explicit opt-in)
        if: inputs.upload_to_testflight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Save build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signed-build
          path: artifacts
          retention-days: 7
