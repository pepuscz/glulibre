name: Repository checks
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check documentation and legal resources
        run: ruby scripts/check_repository.rb
      - name: Test pure observation and Watch logic
        run: swift test
